<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐕 Dogs API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐕 Dogs</h1>
        </header>

        <div class="controls">
            <button class="btn btn-primary" id="addBtn">+ Add</button>
        </div>

        <div id="dogsContainer" class="dogs-list">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="dogModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Dog</h2>
            <form id="dogForm">
                <input type="hidden" id="dogId">
                <div class="form-group">
                    <label for="breed">Breed</label>
                    <input type="text" id="breed" required placeholder="e.g., Golden Retriever">
                </div>
                <div class="form-group">
                    <label for="subBreeds">Sub-breeds (comma-separated)</label>
                    <textarea id="subBreeds" placeholder="e.g., American, English"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h2>Delete?</h2>
            <p>Delete <strong id="deleteDogName"></strong>?</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="app.js"></script>
</body>
</html>
